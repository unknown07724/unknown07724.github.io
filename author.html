<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Author Page</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 20px auto;
      text-align: left;
    }
    h1 {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #ccc;
      padding-bottom: 8px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

<script>
const params = new URLSearchParams(window.location.search);
const auth = params.get('auth'); // reads ?user=

fetch('users.json')
  .then(res => res.json())
  .then(data => {
    const user = data[auth];
    if (!user) {
      document.body.innerHTML = "<h1>User not found</h1>";
      return;
    }

    const username = user.username || "Unknown";
    let description = user.description || "No description";
    let gender = user.gender || "N/A";

    // normalize gender
    const maleVariants = ["male","man","men","boy","♂"];
    const femaleVariants = ["female","woman","women","girl","♀"];
    if (maleVariants.includes(gender.toLowerCase())) gender = "♂";
    if (femaleVariants.includes(gender.toLowerCase())) gender = "♀";
    if (!["♂","♀"].includes(gender)) gender = "N/A";

    // render <br> in description
    description = description.replace(/\n/g, "<br>");

    document.body.innerHTML = `
      <h1>
        <span>${username}</span>
        <span>${gender}</span>
      </h1>
      <p>${description}</p>
    `;
  })
  .catch(err => {
    console.error(err);
    document.body.innerHTML = "<h1>Error loading user data</h1>";
  });
</script>

</body>
</html>
